<!DOCTYPE html>
<html lang="zh-TW">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>聯絡管理員 | 星艦啟航</title>

<link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;500;700;900&display=swap" rel="stylesheet">
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">

<style>

:root {
    --primary: #00f0ff;
    --primary-glow: rgba(0,240,255,.4);
    --bg-dark: #050510;
    --text-main: #fff;
    --text-muted: #a0a0b0;
    --glass-bg: rgba(20,20,35,.6);
    --glass-border: rgba(255,255,255,.1);
}

*{
    margin:0;
    padding:0;
    box-sizing:border-box;
    font-family:'Outfit',sans-serif;
}

body{
    background:var(--bg-dark);
    color:var(--text-main);
}

/* 背景 */
.background{
    position:fixed;
    inset:0;
    z-index:-1;
    background:
    linear-gradient(to bottom,rgba(5,5,16,.3),rgba(5,5,16,1)),
    url('https://images.unsplash.com/photo-1534796636912-3b95b3ab5986?q=80&w=2072&auto=format&fit=crop');
    background-size:cover;
}

/* Navbar */
nav{
    display:flex;
    justify-content:space-between;
    align-items:center;
    padding:20px 5%;
    position:fixed;
    width:100%;
    top:0;
    background:rgba(5,5,16,.8);
    backdrop-filter:blur(12px);
    border-bottom:1px solid var(--glass-border);
}

.logo{
    font-weight:800;
    font-size:1.4rem;
}

.logo i{color:var(--primary)}

.nav-links{
    display:flex;
    gap:25px;
    list-style:none;
}

.nav-links a{
    color:var(--text-muted);
    text-decoration:none;
}

.nav-links a:hover{
    color:#fff;
}

/* 主體 */
.main{
    max-width:900px;
    margin:140px auto 80px;
    padding:20px;
}

/* 區塊 */
.card{
    background:var(--glass-bg);
    border:1px solid var(--glass-border);
    border-radius:16px;
    padding:30px;
    margin-bottom:30px;
    box-shadow:0 0 30px rgba(0,0,0,.3);
}

h1{
    text-align:center;
    font-size:2.8rem;
    margin-bottom:30px;
}

h2{
    border-left:4px solid var(--primary);
    padding-left:10px;
    margin-bottom:20px;
}

/* 8591 */
.shop{
    text-align:center;
}

.shop img{
    max-width:260px;
    transition:.3s;
}

.shop img:hover{
    transform:scale(1.05);
}

/* 表單 */
input,textarea{
    width:100%;
    padding:12px;
    border:none;
    border-radius:6px;
    margin-top:8px;
    margin-bottom:20px;
    background:#020617;
    color:white;
}

button{
    width:100%;
    padding:14px;
    background:var(--primary);
    border:none;
    font-weight:700;
    cursor:pointer;
}

button:hover{
    box-shadow:0 0 20px var(--primary-glow);
}

footer{
    text-align:center;
    padding:30px;
    opacity:.6;
}

@media(max-width:768px){
    .nav-links{display:none;}
}

</style>
</head>

<body>

<div class="background"></div>

<!-- Navbar -->
<nav>
    <div class="logo">
        <i class="fa-solid fa-rocket"></i> STARSHIP
    </div>

    <ul class="nav-links">
        <li><a href="/">首頁</a></li>
        <li><a href="/shop/">商城</a></li>
        <li><a href="/wiki/">Wiki</a></li>
        <li><a href="/contact/">聯絡</a></li>
    </ul>
</nav>

<!-- 主內容 -->
<div class="main">

<h1>📩 聯絡管理員</h1>

<!-- 聯絡方式 -->
<div class="card">

<h2>管理員資訊</h2>

<p>如有問題、BUG、申訴、儲值問題，請透過以下方式聯絡：</p>

<p>💬 Discord：<b>StartShip#0001</b></p>
<p>📧 Email：<b>admin@startship.com</b></p>
<p>⏰ 回覆時間：10:00 ~ 22:00</p>

</div>

<!-- 8591 -->
<div class="card shop">

<h2 class="shop-title">
    <img src="/assets/img/8591.png" alt="8591 實物交易" class="shop-logo">
    8591 贊助平台
</h2>

<p>點擊下方圖片前往贊助：</p>

<a href="https://www.8591.com.tw/" target="_blank">
<img src="https://www.8591.com.tw/v3/images/index/8591logo.png" alt="8591">
</a>

</div>

<!-- 表單 -->
<div class="card">

<h2>問題回報</h2>

<form>

<label>遊戲ID</label>
<input type="text" placeholder="你的遊戲名稱">

<label>聯絡方式</label>
<input type="text" placeholder="Discord / Email">

<label>問題內容</label>
<textarea rows="5" placeholder="請詳細描述"></textarea>

<button type="submit">送出訊息</button>

</form>

</div>

</div>

<footer>
© 2026 星艦啟航 Starship Voyage
</footer>

</body>
</html>
