<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>聯絡管理員 | 星艦啟航</title>
    <link rel="icon" href="../logo/logo.png" type="image/png">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;500;700;900&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
    <link rel="stylesheet" href="../style.css">
    
</head>
<body>

<div class="background"></div>

<nav>
    <div class="logo">
            <img src="../logo/logo.png" alt="Starship Voyage Logo">
            STARSHIP
    </div>
    <ul class="nav-links">
        <li><a href="../#">首頁</a></li>
        <li><a href="#">贊助商城</a></li>
    </ul>
</nav>

<div class="main">
    <h1>📩 聯絡管理員</h1>

    <div class="card">
        <h2>管理員資訊</h2>
        <p style="margin-bottom: 15px; color: var(--text-muted);">如有問題、BUG、申訴、儲值問題，請透過以下方式聯絡：</p>
        <p>💬 Discord：<b style="color: var(--primary);">universe.0000</b></p>
        <p>📧 Email：<b style="color: var(--primary);">admin@startship.com</b></p>
        <p>⏰ 回覆時間：10:00 ~ 22:00</p>
    </div>

    <div class="card shop">
        <h2 style="text-align: left;">贊助平台</h2>
        <p>推薦使用 8591 進行安全交易：</p>
        
        <a href="https://www.8591.com.tw/v3/mall/list/seller-2753321" target="_blank" class="shop-logo-container">
            <img src="./8591.png" alt="8591交易">
        </a>
        
        <p style="font-size: 0.85rem; color: var(--text-muted);">點擊圖片前往官方賣場</p>
    </div>

    <div class="card">
        <h2>問題回報</h2>
        <form id="contactForm">
            <div class="form-group">
                <label>遊戲 ID</label>
                <input type="text" placeholder="輸入您的角色名稱" required>
            </div>
            <div class="form-group">
                <label>聯絡方式</label>
                <input type="text" placeholder="Discord 或 Email" required>
            </div>
            <div class="form-group">
                <label>問題詳細內容</label>
                <textarea rows="5" placeholder="請盡可能詳細描述您遇到的問題..." required></textarea>
            </div>
            <button type="submit">送出訊息</button>
        </form>
    </div>
</div>

<footer>
        <p>&copy; 2026 星艦啟航伺服器 | Startship Voyage</p>
        <p style="margin-top: 10px; font-size: 0.8rem; opacity: 0.6;">Minecraft Server IP: mc.start-ship.com</p>
</footer>

<script>
    // 簡單的表單送出效果
    document.getElementById('contactForm').addEventListener('submit', function(e) {
        e.preventDefault();
        const btn = this.querySelector('button');
        btn.innerText = '傳送中...';
        btn.style.opacity = '0.7';
        
        setTimeout(() => {
            alert('感謝您的回報！管理員將會儘速處理。');
            btn.innerText = '送出訊息';
            btn.style.opacity = '1';
            this.reset();
        }, 1000);
    });
</script>

</body>
</html>
